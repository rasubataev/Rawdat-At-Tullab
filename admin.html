<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050B08">
<meta name="theme-color" content="#F3F7F4" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<title>Админ-панель — Rawdat At-Tullab</title>
<link rel="apple-touch-icon" href="icons/logo.PNG">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 60px}
  .admin-wrap h1{font-size:20px;font-weight:800;color:var(--text);margin:0 0 20px}
  .admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--s-card);padding:18px;margin-bottom:16px}
  .admin-card h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--brand-400);margin:0 0 14px}
  .admin-field{margin-bottom:12px}
  .admin-field label{display:block;font-size:12.5px;color:var(--text-3);margin-bottom:6px}
  .admin-field input, .admin-field textarea{
    width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--r-md);padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;
  }
  .admin-field textarea{min-height:80px;resize:vertical}
  .admin-row{display:flex;gap:10px}
  .admin-row .btn{flex:1}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat-tile{background:var(--surface-2);border-radius:var(--r-md);padding:12px;text-align:center}
  .stat-tile .num{font-size:22px;font-weight:800;color:var(--brand-500)}
  .stat-tile .lbl{font-size:11px;color:var(--text-3);margin-top:2px}
  .admin-msg{font-size:12.5px;margin-top:10px;min-height:16px}
  .admin-msg.ok{color:var(--brand-500)}
  .admin-msg.err{color:var(--danger)}
  .announce-current{font-size:13.5px;color:var(--text-2);background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px;white-space:pre-wrap}
  .announce-current.empty{color:var(--text-3);font-style:italic}
  #gate{max-width:340px;margin:20vh auto 0;padding:0 20px;text-align:center}
  #gate h1{font-size:18px;margin-bottom:16px}
</style>
</head>
<body>

<div id="gate">
  <h1>Админ-панель Rawdat At-Tullab</h1>
  <div class="admin-field"><input type="password" id="gate-key" placeholder="Секретный ключ (STATS_ADMIN_KEY)"></div>
  <button type="button" class="btn btn-primary" style="width:100%" onclick="unlock()">Войти</button>
  <div class="admin-msg err" id="gate-msg"></div>
</div>

<div class="admin-wrap" id="panel" style="display:none">
  <h1>Админ-панель</h1>

  <div class="admin-card">
    <h2>Статистика посещений</h2>
    <div class="stat-grid">
      <div class="stat-tile"><div class="num" id="st-today">—</div><div class="lbl">устройств сегодня</div></div>
      <div class="stat-tile"><div class="num" id="st-views">—</div><div class="lbl">визитов сегодня</div></div>
      <div class="stat-tile"><div class="num" id="st-total">—</div><div class="lbl">всего устройств</div></div>
    </div>
    <div class="admin-msg" id="stats-msg"></div>
  </div>

  <div class="admin-card">
    <h2>Текущее объявление</h2>
    <div class="announce-current" id="announce-current">—</div>
  </div>

  <div class="admin-card">
    <h2>Отправить объявление</h2>
    <p style="font-size:12px;color:var(--text-3);margin:0 0 12px">
      Покажется каждому при следующем открытии приложения (тостом, и уведомлением — у тех, кто их включил).
    </p>
    <div class="admin-field">
      <label>Текст</label>
      <textarea id="announce-text" maxlength="500" placeholder="Например: Добавили новую книгу — мقدمة!"></textarea>
    </div>
    <div class="admin-field">
      <label>Ссылка (необязательно, откроется по тапу на уведомление)</label>
      <input type="text" id="announce-url" placeholder="https://rawdat.ru/...">
    </div>
    <div class="admin-row">
      <button type="button" class="btn btn-primary" onclick="publishAnnounce()">Опубликовать</button>
      <button type="button" class="btn btn-secondary" onclick="clearAnnounce()">Убрать объявление</button>
    </div>
    <div class="admin-msg" id="announce-msg"></div>
  </div>
</div>

<script>
const PROXY = 'https://rawdat-tullab.z7gf59b4cn.workers.dev';
let KEY = '';

function unlock() {
  const k = document.getElementById('gate-key').value.trim();
  if (!k) return;
  KEY = k;
  loadStats().then(ok => {
    if (!ok) {
      document.getElementById('gate-msg').textContent = 'Неверный ключ или KV не настроен';
      return;
    }
    try { sessionStorage.setItem('rawdat-admin-key', k); } catch (e) {}
    document.getElementById('gate').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadAnnouncement();
  });
}

async function loadStats() {
  const msg = document.getElementById('stats-msg');
  try {
    const res = await fetch(`${PROXY}/stats/summary?key=${encodeURIComponent(KEY)}`);
    if (!res.ok) { msg.textContent = ''; msg.className = 'admin-msg'; return false; }
    const data = await res.json();
    document.getElementById('st-today').textContent = data.visitors_today ?? '0';
    document.getElementById('st-views').textContent = data.pageviews_today ?? '0';
    document.getElementById('st-total').textContent = data.unique_visitors_total ?? '0';
    msg.textContent = '';
    return true;
  } catch (e) {
    msg.textContent = 'Не удалось загрузить статистику: ' + e.message;
    msg.className = 'admin-msg err';
    return false;
  }
}

async function loadAnnouncement() {
  const el = document.getElementById('announce-current');
  try {
    const res = await fetch(`${PROXY}/announce/get`);
    const a = await res.json();
    if (a && a.text) {
      el.textContent = a.text + (a.url ? `\n→ ${a.url}` : '');
      el.classList.remove('empty');
    } else {
      el.textContent = 'Сейчас ничего не опубликовано';
      el.classList.add('empty');
    }
  } catch (e) {
    el.textContent = 'Не удалось загрузить';
  }
}

async function publishAnnounce() {
  const text = document.getElementById('announce-text').value.trim();
  const url = document.getElementById('announce-url').value.trim();
  const msg = document.getElementById('announce-msg');
  if (!text) { msg.textContent = 'Введи текст объявления'; msg.className = 'admin-msg err'; return; }
  msg.textContent = 'Публикую…'; msg.className = 'admin-msg';
  try {
    const res = await fetch(`${PROXY}/announce/set?key=${encodeURIComponent(KEY)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, url }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    msg.textContent = 'Опубликовано'; msg.className = 'admin-msg ok';
    loadAnnouncement();
  } catch (e) {
    msg.textContent = 'Ошибка: ' + e.message; msg.className = 'admin-msg err';
  }
}

async function clearAnnounce() {
  const msg = document.getElementById('announce-msg');
  try {
    const res = await fetch(`${PROXY}/announce/set?key=${encodeURIComponent(KEY)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: '', url: '' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('announce-text').value = '';
    document.getElementById('announce-url').value = '';
    msg.textContent = 'Убрано'; msg.className = 'admin-msg ok';
    loadAnnouncement();
  } catch (e) {
    msg.textContent = 'Ошибка: ' + e.message; msg.className = 'admin-msg err';
  }
}

(function init() {
  let saved = '';
  try { saved = sessionStorage.getItem('rawdat-admin-key') || ''; } catch (e) {}
  if (saved) {
    document.getElementById('gate-key').value = saved;
    unlock();
  }
})();
</script>
</body>
</html>
